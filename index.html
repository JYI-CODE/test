<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 추가적인 커스텀 스타일 및 애니메이션 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
        }
        
        .calculator-container {
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .calc-btn {
            transition: all 0.1s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .calc-btn:active {
            transform: scale(0.95);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .display-text {
            /* 긴 숫자가 들어갈 경우를 대비한 처리 */
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 계산기 메인 컨테이너 -->
    <div class="calculator-container bg-white/90 rounded-3xl p-6 w-full max-w-xs sm:max-w-sm border border-white/20">
        
        <!-- 디스플레이 영역 -->
        <div class="bg-gray-800 rounded-2xl p-4 mb-6 shadow-inner text-right relative overflow-hidden">
            <div id="previous-operand" class="text-gray-400 text-sm h-5 mb-1 font-medium tracking-wider"></div>
            <div id="current-operand" class="display-text text-white text-4xl sm:text-5xl font-semibold tracking-tight">0</div>
        </div>

        <!-- 버튼 그리드 -->
        <div class="grid grid-cols-4 gap-3 sm:gap-4">
            
            <!-- 첫 번째 줄 -->
            <button onclick="calculator.clear()" class="calc-btn col-span-3 bg-red-500 hover:bg-red-600 text-white rounded-xl py-3 text-lg font-semibold tracking-wider">C</button>
            <button onclick="calculator.chooseOperation('/')" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 text-xl font-medium">÷</button>

            <!-- 두 번째 줄 -->
            <button onclick="calculator.appendNumber('7')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">7</button>
            <button onclick="calculator.appendNumber('8')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">8</button>
            <button onclick="calculator.appendNumber('9')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">9</button>
            <button onclick="calculator.chooseOperation('*')" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 text-xl font-medium">×</button>

            <!-- 세 번째 줄 -->
            <button onclick="calculator.appendNumber('4')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">4</button>
            <button onclick="calculator.appendNumber('5')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">5</button>
            <button onclick="calculator.appendNumber('6')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">6</button>
            <button onclick="calculator.chooseOperation('-')" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 text-xl font-medium">-</button>

            <!-- 네 번째 줄 -->
            <button onclick="calculator.appendNumber('1')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">1</button>
            <button onclick="calculator.appendNumber('2')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">2</button>
            <button onclick="calculator.appendNumber('3')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">3</button>
            <button onclick="calculator.chooseOperation('+')" class="calc-btn bg-indigo-500 hover:bg-indigo-600 text-white rounded-xl py-3 text-xl font-medium">+</button>

            <!-- 다섯 번째 줄 -->
            <button onclick="calculator.appendNumber('0')" class="calc-btn col-span-2 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">0</button>
            <button onclick="calculator.appendNumber('.')" class="calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-xl py-3 text-xl font-medium">.</button>
            <button onclick="calculator.compute()" class="calc-btn bg-green-500 hover:bg-green-600 text-white rounded-xl py-3 text-xl font-semibold">=</button>

        </div>
    </div>

    <script>
        class Calculator {
            constructor(previousOperandElement, currentOperandElement) {
                this.previousOperandElement = previousOperandElement;
                this.currentOperandElement = currentOperandElement;
                this.clear();
            }

            // 모든 값 초기화 (C 버튼)
            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.shouldResetScreen = false;
                this.updateDisplay();
            }

            // 숫자 입력
            appendNumber(number) {
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number;
                    this.updateDisplay();
                    return;
                }
                
                if (this.shouldResetScreen) {
                    this.currentOperand = number;
                    this.shouldResetScreen = false;
                } else {
                    if (number === '.' && this.currentOperand.includes('.')) return;
                    this.currentOperand = this.currentOperand.toString() + number.toString();
                }
                this.updateDisplay();
            }

            // 연산자 선택
            chooseOperation(operation) {
                if (this.currentOperand === '' && this.previousOperand === '') return;
                
                if (this.currentOperand === '') {
                    this.operation = operation;
                    this.updateDisplay();
                    return;
                }
                
                if (this.previousOperand !== '') {
                    this.compute();
                }
                
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
                this.updateDisplay();
            }

            // 계산 수행 (= 버튼)
            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '*':
                        computation = prev * current;
                        break;
                    case '/':
                        if (current === 0) {
                            this.currentOperand = "오류";
                            this.operation = undefined;
                            this.previousOperand = '';
                            this.shouldResetScreen = true;
                            this.updateDisplay();
                            return;
                        }
                        computation = prev / current;
                        break;
                    default:
                        return;
                }
                
                // 부동 소수점 오차 보정 및 표시 형식 지정
                this.currentOperand = Math.round(computation * 100000000) / 100000000;
                this.operation = undefined;
                this.previousOperand = '';
                this.shouldResetScreen = true;
                this.updateDisplay();
            }

            // 숫자 포맷팅 (천 단위 콤마)
            getDisplayNumber(number) {
                if (number === "오류") return number;
                
                const stringNumber = number.toString();
                const integerDigits = parseFloat(stringNumber.split('.')[0]);
                const decimalDigits = stringNumber.split('.')[1];
                let integerDisplay;
                
                if (isNaN(integerDigits)) {
                    integerDisplay = '';
                } else {
                    integerDisplay = integerDigits.toLocaleString('en-US', { maximumFractionDigits: 0 });
                }
                
                if (decimalDigits != null) {
                    return `${integerDisplay}.${decimalDigits}`;
                } else {
                    return integerDisplay;
                }
            }

            // 화면 업데이트
            updateDisplay() {
                // 현재 입력값 표시
                if (this.currentOperand === '') {
                    this.currentOperandElement.innerText = '0';
                } else if (this.currentOperand === "오류") {
                    this.currentOperandElement.innerText = this.currentOperand;
                } else {
                    this.currentOperandElement.innerText = this.getDisplayNumber(this.currentOperand);
                }

                // 이전 입력값 및 연산자 표시
                if (this.operation != null) {
                    let operationSymbol = this.operation;
                    if (this.operation === '*') operationSymbol = '×';
                    if (this.operation === '/') operationSymbol = '÷';
                    
                    this.previousOperandElement.innerText = 
                        `${this.getDisplayNumber(this.previousOperand)} ${operationSymbol}`;
                } else {
                    this.previousOperandElement.innerText = '';
                }
                
                // 글자 수에 따른 폰트 크기 조절 (간단한 반응형 텍스트)
                const currentLength = this.currentOperandElement.innerText.length;
                if(currentLength > 12) {
                    this.currentOperandElement.classList.replace('text-4xl', 'text-2xl');
                    this.currentOperandElement.classList.replace('sm:text-5xl', 'sm:text-3xl');
                } else if (currentLength > 8) {
                    this.currentOperandElement.classList.replace('text-4xl', 'text-3xl');
                    this.currentOperandElement.classList.replace('sm:text-5xl', 'sm:text-4xl');
                    this.currentOperandElement.classList.replace('text-2xl', 'text-3xl');
                    this.currentOperandElement.classList.replace('sm:text-3xl', 'sm:text-4xl');
                } else {
                    this.currentOperandElement.classList.replace('text-2xl', 'text-4xl');
                    this.currentOperandElement.classList.replace('sm:text-3xl', 'sm:text-5xl');
                    this.currentOperandElement.classList.replace('text-3xl', 'text-4xl');
                    this.currentOperandElement.classList.replace('sm:text-4xl', 'sm:text-5xl');
                }
            }
        }

        // DOM 요소 할당 및 인스턴스 생성
        const previousOperandElement = document.getElementById('previous-operand');
        const currentOperandElement = document.getElementById('current-operand');
        const calculator = new Calculator(previousOperandElement, currentOperandElement);

        // 키보드 입력 지원
        document.addEventListener('keydown', e => {
            if (e.key >= 0 && e.key <= 9) calculator.appendNumber(e.key);
            if (e.key === '.') calculator.appendNumber(e.key);
            if (e.key === '=' || e.key === 'Enter') {
                e.preventDefault();
                calculator.compute();
            }
            if (e.key === 'Backspace') {
                // 백스페이스 기능 (필요시 구현)
            }
            if (e.key === 'Escape' || e.key === 'c' || e.key === 'C') calculator.clear();
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') {
                calculator.chooseOperation(e.key);
            }
        });
    </script>
</body>
</html>
